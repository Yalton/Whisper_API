services:
  whisper_api:
    build: .
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "${WHISPER_API_PORT:-8001}:8000"
    runtime: nvidia
    # Hard cap so a runaway request is OOM-killed inside this container rather
    # than triggering a host-wide OOM on the host. Swap is not added on top.
    mem_limit: 12g
    memswap_limit: 12g
    # Driver 535 (CUDA 12.2) + CUDA 12.8 image: mask the bundled
    # forward-compat libs or CUDA silently falls back to CPU.
    tmpfs:
      - /usr/local/cuda/compat
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN:?Set AUTH_TOKEN in the environment}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-large-v3}
      - ASR_BACKEND=${ASR_BACKEND:-whisper}
      - COMPUTE_DEVICE=${COMPUTE_DEVICE:-cuda}
      - QWEN_ASR_MODEL=${QWEN_ASR_MODEL:-Qwen/Qwen3-ASR-1.7B}
      - QWEN_ALIGNER_MODEL=${QWEN_ALIGNER_MODEL:-Qwen/Qwen3-ForcedAligner-0.6B}
      - QWEN_DTYPE=${QWEN_DTYPE:-auto}
      - QWEN_ATTN_IMPLEMENTATION=${QWEN_ATTN_IMPLEMENTATION:-sdpa}
      - QWEN_MAX_NEW_TOKENS=${QWEN_MAX_NEW_TOKENS:-4096}
      - QWEN_MAX_BATCH_SIZE=${QWEN_MAX_BATCH_SIZE:-8}
      # Seconds idle before either backend releases its weights.
      - ASR_IDLE_TIMEOUT=${ASR_IDLE_TIMEOUT:-300}
      # Audio longer than this is transcribed in chunks of this many seconds,
      # bounding host RAM per request. 0 disables splitting.
      - ASR_CHUNK_SECONDS=${ASR_CHUNK_SECONDS:-1800}
      # Whisper decodes this many speech segments per GPU batch; 0 is the slower
      # sequential decoder. 8 was as fast as 16 on the 4090 with ~2.5 GB less VRAM,
      # but batching loses speech in fast commentary over video audio: on 180 s of
      # a reaction stream it kept 408 words (VAD dropped 82-101 s and 152-180 s)
      # against 608 sequential, ~10 s for the sequential pass. Keep 0 unless a
      # caller only needs rough text.
      - WHISPER_BATCH_SIZE=${WHISPER_BATCH_SIZE:-0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
